<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <a href="index.html" class="header-name">Alex Ato</a>
        <nav>
          <a href="index.html" class = "header-inicio">Inicio</a>
          <a href="portafolio.html" class = "header-button">Portafolio</a>
       </nav>
      </header>

    <div class="layout">
        <article class="layout__card">
            <div class="card__container-img">
                <img src="./coche.jpg" class="card__img" alt="auto">
            </div>
            <div class="card__content">
                <h2 class="card__title">
                    Les muestro una foto de un nuevo auto, se los recomiendo, es muy cómodo.
                </h2>

                <p class="card__description">
                    El auto es de segunda mano, y es bastante barato, tiene mucho espacio en el maletero, es un auto híbrido y no gasta mucha gasolina.
                </p>
                <div class="card__user">
                    <div class="user__info">
                        <div user__container-img>
                            <img class="user__img" src="./yo.jpg" alt="usuario">
                        </div>
                        <div class="user__container-name">
                            <span class="user__name">Alexander Ato</span>
                            <span class="user__date">4/4/2010</span>
                        </div>

                    </div>

                
                </div>
            </div>
        </article>
    </div>
